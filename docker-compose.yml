services:
  app:
    build: .
    # Artık 3000 portunu dışarı açmamıza gerek yok, sadece iç ağda (nginx için) açık kalacak.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    environment:
      - UV_THREADPOOL_SIZE=128
    dns:
      - 8.8.8.8
      - 1.1.1.1

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/nginx/certs:ro
    depends_on:
      - app
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-uptimemonitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-uptimemonitor}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Faz 1.6: automatic, retention-pruned PostgreSQL backups. Dumps land in the
  # `db_backups` volume — mount or sync that path (e.g. with restic/rclone) to
  # off-site storage, since a volume on the same host is not a real backup.
  backup:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-uptimemonitor}
      - PGHOST=db
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - db_backups:/backups
      - ./scripts/backup-db.sh:/scripts/backup-db.sh:ro
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    restart: always

volumes:
  pgdata:
  db_backups:
